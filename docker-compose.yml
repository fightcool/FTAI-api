# 适配本地构建+服务器部署的docker-compose.yml
services:
  # 你的二次开发项目服务（使用本地构建的ftai-api镜像）
  ftai-api:
    build: .  
    image: ftai-api:latest  # 本地构建的镜像名
    container_name: ftai-api-container
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"  # 服务器3000端口映射到容器3000端口
    volumes:
      - ./data:/data  # 数据持久化（如配置、日志）
      - ./logs:/app/logs
    environment:
      # PostgreSQL连接信息（与下方postgres服务配置一致）
      - SQL_DSN=postgresql://ftai-api:95044855@postgres:5432/ftai-api
      - REDIS_CONN_STRING=redis://redis  # Redis连接（Docker内部服务名）
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis缓存服务
  redis:
    image: redis:latest
    container_name: redis
    restart: always

  # PostgreSQL数据库服务（与你的配置一致）
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ftai-api
      POSTGRES_PASSWORD: 95044855
      POSTGRES_DB: ftai-api
    volumes:
      - pg_data:/var/lib/postgresql/data  # 数据库数据持久化

# 持久化卷（容器重启数据不丢失）
volumes:
  pg_data: